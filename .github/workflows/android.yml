name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Download and Extract NDK r21e
        run: |
          wget -q https://google.com
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "NDK_PATH=$PWD/android-ndk-r21e" >> $GITHUB_ENV

      - name: Setup Haxe Environment
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5 

      - name: Install Game Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-addons
          
          haxelib git faxe https://github.com
          haxelib git polymod https://github.com
          haxelib git extension-androidtools https://github.com
          
          # Directly referencing the built-in $ANDROID_HOME path instead of downloading a duplicate
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK ${{ env.NDK_PATH }}
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Compile Game to APK
        run: haxelib run lime build android -release

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kade-Engine-1.8-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          
